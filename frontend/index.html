<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Новобілоуський ліцей</title>
    <!-- SEO_HEAD -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html.js-loading { background: #f6f6f8; }
      html.js-loading .seo-fallback { visibility: hidden; }
      html.js-loading #root::before {
        content: "";
        position: fixed;
        top: 50%;
        left: 50%;
        width: 32px;
        height: 32px;
        margin: -16px;
        border: 3px solid #e7e7eb;
        border-top-color: #dd6d06;
        border-radius: 50%;
        animation: loading-spin 0.8s linear infinite;
      }
      @keyframes loading-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        html.js-loading #root::before { animation: none; }
      }
    </style>
    <script>
      document.documentElement.classList.add('js-loading');
      window.setTimeout(() => document.documentElement.classList.remove('js-loading'), 6000);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"><!-- SEO_FALLBACK --></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
